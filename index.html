<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>S.A.B.P. // TERMINAL DE GESTION</title>
    <style>
        :root {
            --bg-deep: #0f0a12;      /* Fond très sombre */
            --bg-panel: #1a1622;     /* Panneaux gris-violet */
            --accent-blue: #6366f1;  /* Accent néon violet/bleu */
            --text-main: #e2e8f0;    /* Blanc cassé */
            --text-muted: #94a3b8;   /* Gris texte */
            --border: #332d3d;       /* Bordure fine */
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 240px; background: #15111a;
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 20px;
        }

        .nav-item {
            padding: 12px; margin-bottom: 5px; cursor: pointer;
            border-radius: 8px; color: var(--text-muted);
            font-size: 0.9rem; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.1); color: var(--accent-blue);
        }

        /* --- MAIN AREA --- */
        .main { flex: 1; display: flex; flex-direction: column; padding: 30px; gap: 20px; }

        /* HEADER */
        .header-dash {
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 25px; display: flex; justify-content: space-between;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 10px; }
        .stat-card {
            background: #231f2b; padding: 15px; border-radius: 8px;
            border-left: 3px solid var(--accent-blue);
        }

        /* FILTRES & TABLEAU */
        .control-panel {
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
        }
        .filter-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-input {
            background: #15111a; border: 1px solid var(--border);
            padding: 10px; border-radius: 6px; color: white; flex: 1;
        }

        /* AGENT CARD */
        .agent-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .agent-card {
            background: #231f2b; padding: 15px; border-radius: 10px;
            display: flex; align-items: center; gap: 15px; border: 1px solid var(--border);
        }
        .avatar { width: 40px; height: 40px; background: #332d3d; border-radius: 50%; }

    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <div class="sidebar">
        <h2 style="font-size: 1.2rem; margin-bottom: 30px;">S.A.B.P.</h2>
        <div class="nav-item active">Centre de Dispatch</div>
        <div class="nav-item">Requêtes & Rapports</div>
        <div class="nav-item">Documentation</div>
        <div class="nav-item">Gestion Unités</div>
    </div>

    <!-- DASHBOARD -->
    <main class="main">
        <div class="header-dash">
            <div>
                <h1 style="margin:0;">CENTRE DE DISPATCH</h1>
                <p style="color:var(--text-muted); font-size: 0.9rem;">Pilotage opérationnel en temps réel.</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div>UNITES</div><div style="font-size:1.4rem;">7</div></div>
                <div class="stat-card"><div>ACTIVES</div><div style="font-size:1.4rem;">5</div></div>
                <div class="stat-card"><div>AFFECTÉS</div><div style="font-size:1.4rem;">8</div></div>
                <div class="stat-card"><div>ATTENTE</div><div style="font-size:1.4rem;">1</div></div>
            </div>
        </div>

        <div class="control-panel">
            <div class="filter-row">
                <input type="text" class="filter-input" placeholder="Rechercher une unité...">
                <button style="background:var(--accent-blue); border:none; padding:10px 20px; border-radius:6px; color:white;">FILTRER</button>
            </div>
            
            <div class="agent-list">
                <div class="agent-card">
                    <div class="avatar"></div>
                    <div>
                        <div style="font-weight:bold;">T. Santos</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">En attente de dispatch</div>
                    </div>
                </div>
                <div class="agent-card">
                    <div class="avatar"></div>
                    <div>
                        <div style="font-weight:bold;">O. Taylor</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">En patrouille active</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
